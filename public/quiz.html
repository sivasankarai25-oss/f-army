<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Farmy Quiz — FARMY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

    </div>

  <script src="js/farmy-data.js"></script>
  <script src="js/farmy-i18n.js"></script>
